version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: reconcileai
  redis:
    image: redis:alpine
  backend:
    build: ../backend
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  worker:
    build: ../workers
    depends_on:
      - redis
      - db
